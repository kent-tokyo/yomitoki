[package]
name = "rensei"
version = "0.1.0"
edition = "2024"
authors = ["kent-tokyo <kent-tokyo@users.noreply.github.com>"]
description = "Fast, explainable, route-free molecular synthesizability diagnostics."
license = "MIT OR Apache-2.0"
repository = "https://github.com/kent-tokyo/rensei"

[dependencies]
chematic = { version = "0.11", features = ["smiles", "perception", "chem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
