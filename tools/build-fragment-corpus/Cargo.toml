[package]
name = "build-fragment-corpus"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "build-fragment-corpus"
path = "src/main.rs"

[dependencies]
yomitoki = { path = "../.." }
chematic = { version = "0.12", features = ["smiles", "perception", "mol", "fp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
